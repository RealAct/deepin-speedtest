name: Release

# Builds the .deb for a GitHub release and attaches it (plus SHA256SUMS).
# Runs automatically when a release is published. It can also be run by hand
# from the Actions tab: give a tag, e.g. v1.0.1, and tick "create" to make a
# new release (and tag) from the selected branch, or leave it unticked to add
# the .deb to a release that already exists.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true
      create:
        description: "Create this release and tag from the selected branch first"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  create:
    name: Create the release
    if: github.event_name == 'workflow_dispatch' && inputs.create
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release ${{ inputs.tag }} at ${{ github.sha }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$' || { echo "Tag must look like v1.2.3"; exit 1; }
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Deepin Speedtest ${TAG#v}" --generate-notes

  build:
    name: Build .deb
    needs: create
    # Run after "create", or straight away when it was skipped.
    if: ${{ !cancelled() && (needs.create.result == 'success' || needs.create.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Built on the oldest supported base (Ubuntu 20.04, Python 3.8, debhelper 12)
    # so the Architecture: all package installs on every supported distro.
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate the tag
        id: version
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          echo "$VERSION" | grep -Eq '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$' || { echo "bad version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The release workflow's own tools (this commit) ...
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false

      # ... and the source exactly as tagged.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          path: src
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3 python3-pytest python3-pyqt5 \
            openssl lintian fakeroot ca-certificates

      - name: Stamp the version from the tag
        run: python3 ci/tools/set_version.py "${{ steps.version.outputs.version }}" src

      - name: Build
        working-directory: src
        run: dpkg-buildpackage -us -uc -b

      - name: Check and checksum
        run: |
          mkdir dist
          cp deepin-speedtest_*_all.deb dist/
          lintian dist/*.deb
          cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-deb
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only this job can write, and only to releases
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-deb
          path: dist

      - name: Upload assets
        run: gh release upload "$TAG" dist/*.deb dist/SHA256SUMS --clobber
